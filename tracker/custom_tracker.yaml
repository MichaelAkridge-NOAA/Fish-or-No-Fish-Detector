tracker_type: botsort  # Using BoT-SORT for better tracking in dense environments
track_high_thresh: 0.35  # Slightly increased to improve tracking precision
track_low_thresh: 0.15  # Slightly increased to reduce false positives
new_track_thresh: 0.4  # Lower threshold to initiate new tracks more easily
track_buffer: 60  # Increased to handle longer occlusions
match_thresh: 0.6  # Slightly lower for lenient matching in close proximity
fuse_score: False  # Focus more on IoU distance for matching
gmc_method: None  # Disable global motion compensation for simplicity
proximity_thresh: 0.5  # Default proximity threshold for matching (ReID not enabled)
appearance_thresh: 0.25  # Default appearance threshold (ReID not enabled)
with_reid: False  # Ensure ReID is disabled for better performance

